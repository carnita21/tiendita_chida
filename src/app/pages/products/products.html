<!-- NAVBAR -->
<nav
  style="
    background:#0891b2;
    padding:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    color:white;
  "
>
  <h2>Sistema de Productos</h2>

  <div>
    <a
      routerLink="/"
      style="
        color:white;
        text-decoration:none;
        margin-right:20px;
      "
    >
      Inicio
    </a>

    <a
      routerLink="/products"
      style="
        color:white;
        text-decoration:none;
        font-weight:bold;
      "
    >
      Productos
    </a>
  </div>
</nav>

<div style="padding:30px;">

  <h1>Lista de Productos</h1>

  <table
    border="1"
    width="100%"
    cellspacing="0"
    cellpadding="10"
  >
    <thead>
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Precio</th>
      </tr>
    </thead>

    <tbody>
      @for(product of products; track product.id){
      <tr>
        <td>{{ product.id }}</td>
        <td>{{ product.name }}</td>
        <td>${{ product.price }}</td>
      </tr>
      }
    </tbody>
  </table>

  <br>

  <button
    (click)="openModal()"
    style="
      background:#0891b2;
      color:white;
      border:none;
      padding:10px 20px;
      cursor:pointer;
    "
  >
    Agregar Producto
  </button>

</div>

<!-- MODAL -->
@if(modalOpen){

<div
  style="
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.5);
    display:flex;
    justify-content:center;
    align-items:center;
  "
>

  <div
    style="
      background:white;
      width:400px;
      padding:20px;
      border-radius:10px;
    "
  >

    <h2>Nuevo Producto</h2>

    <form [formGroup]="form">

      <div>
        <label>Nombre</label>
        <br>
        <input
          type="text"
          formControlName="name"
          style="
            width:100%;
            padding:8px;
            margin-top:5px;
          "
        >
      </div>

      <br>

      <div>
        <label>Precio</label>
        <br>
        <input
          type="number"
          formControlName="price"
          style="
            width:100%;
            padding:8px;
            margin-top:5px;
          "
        >
      </div>

      <br>

      <button
        type="button"
        (click)="saveProduct()"
        style="
          background:green;
          color:white;
          border:none;
          padding:10px 15px;
          margin-right:10px;
        "
      >
        Guardar
      </button>

      <button
        type="button"
        (click)="closeModal()"
        style="
          background:red;
          color:white;
          border:none;
          padding:10px 15px;
        "
      >
        Cancelar
      </button>

    </form>

  </div>

</div>

}
